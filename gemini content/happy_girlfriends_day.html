<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Neha ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Floating Hearts Animation */
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1.5) rotate(45deg); opacity: 0; }
        }

        .floating-heart {
            position: absolute;
            bottom: -10%;
            animation: floatUp ease-in infinite;
            color: rgba(255, 192, 203, 0.4);
            z-index: 0;
            pointer-events: none;
        }

        /* Soft Pulse for Special Slide */
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s ease-in-out infinite;
        }

        /* Card Transitions */
        .slide-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .slide-hidden {
            opacity: 0;
            transform: scale(0.95) translateY(10px);
        }

        .special-font {
            font-family: 'Dancing Script', cursive;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-200 via-pink-400 to-red-500 flex items-center justify-center p-4 relative text-center">

    <!-- Container for dynamic floating hearts -->
    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Main Interactive Card -->
    <div id="main-card" class="relative z-10 w-full max-w-lg cursor-pointer slide-transition" onclick="nextSlide()">
        <div class="bg-white/20 backdrop-blur-xl border border-white/40 p-8 sm:p-12 rounded-3xl shadow-2xl flex flex-col items-center justify-center min-h-[450px] transform transition-transform hover:scale-[1.02]">
            
            <!-- Icon -->
            <div id="icon-container" class="mb-8 text-pink-100 p-5 rounded-full bg-white/20 shadow-inner">
                <!-- SVG will be injected here -->
            </div>

            <!-- Title -->
            <h1 id="slide-title" class="text-3xl sm:text-4xl font-bold text-white mb-4 drop-shadow-md leading-tight">
                Loading...
            </h1>

            <!-- Subtitle -->
            <p id="slide-subtitle" class="text-lg sm:text-xl text-pink-50 leading-relaxed font-medium drop-shadow-sm">
            </p>

            <!-- Signature -->
            <p id="slide-signature" class="mt-8 text-2xl text-white font-bold italic tracking-wide hidden special-font">
            </p>

            <!-- Action Area / Hint -->
            <div class="mt-12 w-full flex justify-center h-12 items-center">
                <button id="action-btn" class="hidden items-center gap-2 bg-white/25 hover:bg-white/40 text-white px-8 py-3 rounded-full transition-all backdrop-blur-md border border-white/50 font-semibold shadow-lg">
                    Tap to open <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <p id="hint-text" class="text-white/80 text-sm animate-pulse flex items-center gap-2 hidden">
                    Tap anywhere to continue <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </p>
            </div>
            
        </div>
    </div>

    <!-- Progress Dots -->
    <div id="dots-container" class="absolute bottom-8 left-0 right-0 flex justify-center gap-3 z-20">
        <!-- Dots will be injected here -->
    </div>

    <script>
        // Icons represented as SVG strings to avoid external dependencies
        const icons = {
            stars: `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4M3 5h4"/></svg>`,
            sparkles: `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3l1.9 5.8 1.9-5.8a2 2 0 0 1 1.3-1.3l5.8-1.9-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>`,
            heartHandshake: `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08v0c.82.82 2.13.9 3.03.2l1.93-1.54"/><path d="M15 8.35 12 11.35"/></svg>`,
            quote: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-500 fill-red-500"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>`,
            heart: `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="text-white"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`
        };

        const slides = [
            {
                title: "Hey Neha...",
                subtitle: "I have a little surprise for you. ❤️",
                icon: icons.stars,
                type: "start"
            },
            {
                title: "Happy Girlfriend's Day!",
                subtitle: "To the most beautiful, amazing, and perfect girl in the entire universe.",
                icon: icons.sparkles
            },
            {
                title: "You are my everything.",
                subtitle: "Every moment with you feels like magic. You're not just my girlfriend; you're my peace, my joy, and my whole world.",
                icon: icons.heartHandshake
            },
            {
                title: "To my adorable...",
                subtitle: "Bittu 🤌🏻",
                icon: icons.quote,
                highlight: true
            },
            {
                title: "I Love You.",
                subtitle: "More than words could ever explain. Thank you for being mine today, tomorrow, and forever.",
                icon: icons.heart,
                signature: "Forever yours, Saurabh ❤️",
                type: "end"
            }
        ];

        let currentSlide = 0;
        let isTransitioning = false;

        const card = document.getElementById('main-card');
        const iconContainer = document.getElementById('icon-container');
        const titleEl = document.getElementById('slide-title');
        const subtitleEl = document.getElementById('slide-subtitle');
        const signatureEl = document.getElementById('slide-signature');
        const actionBtn = document.getElementById('action-btn');
        const hintText = document.getElementById('hint-text');
        const dotsContainer = document.getElementById('dots-container');

        // Initialize progress dots
        function initDots() {
            dotsContainer.innerHTML = '';
            slides.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = `h-2 rounded-full transition-all duration-500 ${index === currentSlide ? 'w-10 bg-white' : 'w-3 bg-white/30'}`;
                dotsContainer.appendChild(dot);
            });
        }

        function renderSlide() {
            const slide = slides[currentSlide];

            // Set Icon
            iconContainer.innerHTML = slide.icon;
            
            // Handle Highlight Styling (For "Bittu")
            if (slide.highlight) {
                iconContainer.classList.add('animate-pulse-soft', 'bg-white/40');
                titleEl.className = 'text-2xl sm:text-3xl font-bold text-white mb-2 drop-shadow-md leading-tight';
                subtitleEl.className = 'text-5xl sm:text-7xl mt-4 font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-red-100 to-red-600 drop-shadow-2xl special-font py-2';
            } else {
                iconContainer.classList.remove('animate-pulse-soft', 'bg-white/40');
                titleEl.className = 'text-3xl sm:text-4xl font-bold text-white mb-4 drop-shadow-md leading-tight';
                subtitleEl.className = 'text-lg sm:text-xl text-pink-50 leading-relaxed font-medium drop-shadow-sm';
            }

            // Set Texts
            titleEl.textContent = slide.title;
            subtitleEl.textContent = slide.subtitle;

            // Set Signature
            if (slide.signature) {
                signatureEl.textContent = slide.signature;
                signatureEl.classList.remove('hidden');
            } else {
                signatureEl.classList.add('hidden');
            }

            // Set Action Buttons
            actionBtn.classList.add('hidden');
            hintText.classList.add('hidden');
            
            if (slide.type === "start") {
                actionBtn.classList.remove('hidden');
                actionBtn.classList.add('flex');
                actionBtn.innerHTML = `Tap to open <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
            } else if (slide.type === "end") {
                actionBtn.classList.remove('hidden');
                actionBtn.classList.add('flex');
                actionBtn.innerHTML = `Read again <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
            } else {
                hintText.classList.remove('hidden');
                hintText.classList.add('flex');
            }

            initDots();
        }

        function nextSlide() {
            if (isTransitioning) return;

            isTransitioning = true;
            card.classList.add('slide-hidden');

            setTimeout(() => {
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                } else {
                    currentSlide = 0; // Reset
                }
                
                renderSlide();
                
                // Slight delay before fading back in
                setTimeout(() => {
                    card.classList.remove('slide-hidden');
                    isTransitioning = false;
                }, 50);

            }, 400); // Matches CSS transition duration
        }

        // Generate Floating Hearts Background
        function createFloatingHearts() {
            const container = document.getElementById('hearts-container');
            const heartSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
            
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = heartSVG;
                
                // Randomize position, size, and animation
                const size = Math.random() * 20 + 10; // 10px to 30px
                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${Math.random() * 5 + 5}s`; // 5s to 10s
                heart.style.animationDelay = `${Math.random() * 5}s`;
                
                container.appendChild(heart);
            }
        }

        // Initialize on load
        window.onload = () => {
            createFloatingHearts();
            renderSlide();
            // Trigger initial fade in
            card.classList.remove('slide-hidden');
        };

    </script>
</body>
</html>

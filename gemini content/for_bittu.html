<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Bittu 🤌🏻 ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050005; /* Deep dark cosmic background */
            font-family: 'Poppins', sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* Prevent scroll on mobile for full interactive canvas */
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to canvas for bursts, handle explicitly on document */
        }

        /* Premium Glassmorphism Card */
        .glass-card {
            background: rgba(20, 0, 10, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 100, 150, 0.3);
            box-shadow: 0 8px 32px 0 rgba(255, 20, 80, 0.3), inset 0 0 20px rgba(255, 100, 150, 0.1);
            border-radius: 2rem;
            padding: 2.5rem;
            max-width: 90%;
            width: 450px;
            text-align: center;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* Slide Transition Animations */
        .slide-content {
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 1;
            transform: translateZ(0) scale(1) translateY(0);
        }

        .slide-hidden-next {
            opacity: 0;
            transform: translateZ(-100px) scale(0.8) translateY(-20px);
            pointer-events: none;
            position: absolute;
        }

        .slide-hidden-prev {
            opacity: 0;
            transform: translateZ(100px) scale(1.2) translateY(20px);
            pointer-events: none;
            position: absolute;
        }

        .special-font {
            font-family: 'Dancing Script', cursive;
        }
        
        .title-font {
            font-family: 'Cinzel', serif;
        }

        /* Glowing Text Effects */
        .text-glow {
            text-shadow: 0 0 10px rgba(255, 100, 150, 0.6), 0 0 20px rgba(255, 50, 100, 0.4);
        }
        
        .text-glow-intense {
            text-shadow: 0 0 15px rgba(255, 50, 100, 0.8), 0 0 30px rgba(255, 0, 50, 0.6), 0 0 45px rgba(255, 0, 50, 0.4);
        }

        /* Click Burst Particle */
        .burst-particle {
            position: absolute;
            pointer-events: none;
            z-index: 50;
            animation: burstAnim 1s ease-out forwards;
            filter: drop-shadow(0 0 5px rgba(255,100,150,0.8));
        }

        @keyframes burstAnim {
            0% { transform: translate(-50%, -50%) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

        /* Tap indicator */
        .tap-indicator {
            animation: pulse-op 2s infinite;
        }
        @keyframes pulse-op {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .gradient-text {
            background: linear-gradient(to right, #ff758c 0%, #ff7eb3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-container">
        
        <div class="glass-card relative overflow-hidden">
            <!-- Animated Border Glow -->
            <div class="absolute inset-0 bg-gradient-to-r from-pink-500/20 via-red-500/20 to-pink-500/20 blur-xl z-0 animate-pulse"></div>

            <div id="slides-container" class="relative z-10 w-full min-h-[300px] flex items-center justify-center">
                <!-- Slides will be injected here by JS -->
            </div>
            
            <!-- Progress & Hint -->
            <div class="relative z-10 mt-8">
                <div id="progress-dots" class="flex justify-center gap-2 mb-4">
                    <!-- Dots -->
                </div>
                <p class="tap-indicator text-pink-200/60 text-xs font-light tracking-widest uppercase">
                    Tap anywhere to feel the love
                </p>
            </div>
        </div>

    </div>

    <script>
        // --- CONTENT (Hinglish) ---
        const storySlides = [
            {
                title: "Hey Neha... ✨",
                text: "Happy Friendship Day to my beautiful girl! 🫰",
                highlight: false
            },
            {
                title: "Mine 'Everything' 💖",
                text: "You always say, pyar dost nhi ho sakta... par tum toh mera daily stress km karke ek painkiller ki tarah, ek dost ki tarah meri life me khushi bani hui ho. Meri sabse achi dost, aur mera sukoon. 💊✨",
                highlight: false
            },
            {
                title: "Hamesha Mere Sath 💗🫂",
                text: "Din bhar baith kr sari jindagi muje paresha  krte hue bitani hai tumhe meri sabse achi dost mera pyr and meri hone wali wife bankr bhi 😘. Tum kal bhi mere sath thi, aaj bhi ho, aur hamesha rahogi 🫂. Din bhar ki saari baatein, jindagi bhar ka sara kalesh tumhe mere sath hi toh krna h na ?.🤌🏻",
                highlight: false
            },
            {
                title: "Sirf Tum... 👑",
                text: "Tumhari jagah koi aur le hi nahi sakta. Mera har ek special moment, har choti khushi sirf tumhare sath hi poori hoti hai. Mera behave kesa bhi ho ye reality nhi badlegi ki m tumhara hu, and hamesha tumhara rahuga",
                highlight: true
            },
            {
                title: "A Bond Forever 💍",
                text: "Aur ek din... humari ye pyari si dosti aur behisaab pyaar ek khubsurat shaadi me badal jayegi.And hm dono hamesha hamesha ke liye ek ho jayege. We will make this forever.",
                highlight: false
            },
            {
                title: "Bittu 🤌🏻",
                text: "I love you the most. Happy Friendship Day to my forever best friend & future wifey.",
                signature: "- Tumhara Saurabh ❤️",
                highlight: true
            }
        ];

        let currentSlide = 0;
        let isAnimating = false;

        const slidesContainer = document.getElementById('slides-container');
        const dotsContainer = document.getElementById('progress-dots');

        // --- UI LOGIC ---
        function renderDots() {
            dotsContainer.innerHTML = '';
            storySlides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `h-1.5 rounded-full transition-all duration-500 ${i === currentSlide ? 'w-8 bg-pink-400 shadow-[0_0_8px_#ff758c]' : 'w-2 bg-pink-900/50'}`;
                dotsContainer.appendChild(dot);
            });
        }

        function createSlideHTML(slide, index) {
            const isVisible = index === currentSlide;
            const classNames = `slide-content absolute w-full flex flex-col items-center justify-center ${isVisible ? '' : 'slide-hidden-next'}`;
            
            let html = `<div id="slide-${index}" class="${classNames}">`;
            
            if (slide.highlight && slide.title === "Bittu 🤌🏻") {
                html += `<h1 class="text-6xl special-font gradient-text text-glow-intense mb-6 py-2">${slide.title}</h1>`;
            } else {
                html += `<h1 class="text-3xl sm:text-4xl title-font font-bold text-pink-100 text-glow mb-5">${slide.title}</h1>`;
            }

            html += `<p class="text-base sm:text-lg text-pink-50/90 leading-relaxed font-medium">${slide.text}</p>`;
            
            if (slide.signature) {
                html += `<p class="mt-8 text-2xl text-pink-200 special-font text-glow-intense">${slide.signature}</p>`;
            }
            
            html += `</div>`;
            return html;
        }

        function initUI() {
            let allSlidesHTML = '';
            storySlides.forEach((slide, index) => {
                allSlidesHTML += createSlideHTML(slide, index);
            });
            slidesContainer.innerHTML = allSlidesHTML;
            renderDots();
        }

        function nextSlide(e) {
            if (isAnimating) return;
            
            // Create burst effect at click/touch location
            createBurst(e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth/2, 
                        e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight/2);

            if (currentSlide >= storySlides.length - 1) {
                // Optional: Loop back or stay at end. Let's loop.
                transitionTo(0);
                return;
            }

            transitionTo(currentSlide + 1);
        }

        function transitionTo(newIndex) {
            isAnimating = true;
            const currentEl = document.getElementById(`slide-${currentSlide}`);
            const nextEl = document.getElementById(`slide-${newIndex}`);

            // Animate out current
            currentEl.className = 'slide-content absolute w-full flex flex-col items-center justify-center slide-hidden-prev';
            
            // Prepare next (ensure it comes from 'next' position)
            nextEl.className = 'slide-content absolute w-full flex flex-col items-center justify-center slide-hidden-next';
            
            // Force reflow
            void nextEl.offsetWidth; 

            // Animate in next
            nextEl.className = 'slide-content absolute w-full flex flex-col items-center justify-center';

            currentSlide = newIndex;
            renderDots();

            // Unlock after transition
            setTimeout(() => {
                isAnimating = false;
            }, 800);
        }

        // --- INTERACTIVE BURST EFFECT ---
        function createBurst(x, y) {
            const colors = ['#ff758c', '#ff7eb3', '#ffffff', '#ff0055'];
            for(let i=0; i<8; i++) {
                const particle = document.createElement('div');
                particle.className = 'burst-particle special-font';
                particle.innerHTML = '❤';
                particle.style.color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.fontSize = (Math.random() * 20 + 10) + 'px';
                
                // Randomize trajectory
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 50;
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                const rot = (Math.random() * 360) + 'deg';
                
                particle.style.setProperty('--tx', tx);
                particle.style.setProperty('--ty', ty);
                particle.style.setProperty('--rot', rot);
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }

        // Bind global click/touch
        document.addEventListener('click', nextSlide);
        document.addEventListener('touchstart', (e) => {
            // Only trigger if we aren't swiping wildly
            nextSlide(e);
        }, {passive: false});


        // --- THREE.JS 3D SCENE ---
        let scene, camera, renderer, heartParticles, bgParticles;
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        function init3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            // Fog to fade particles into the background
            scene.fog = new THREE.FogExp2(0x050005, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 150;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 1. Create Background Particles (Cosmic dust)
            const bgGeo = new THREE.BufferGeometry();
            const bgCount = 1500;
            const bgPos = new Float32Array(bgCount * 3);
            for(let i=0; i<bgCount*3; i++) {
                bgPos[i] = (Math.random() - 0.5) * 800;
            }
            bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
            
            // Custom texture for soft glow particles
            const canvasObj = document.createElement('canvas');
            canvasObj.width = 16;
            canvasObj.height = 16;
            const context = canvasObj.getContext('2d');
            const gradient = context.createRadialGradient(8, 8, 0, 8, 8, 8);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            context.fillStyle = gradient;
            context.fillRect(0,0,16,16);
            const particleTexture = new THREE.CanvasTexture(canvasObj);

            const bgMat = new THREE.PointsMaterial({
                color: 0xff7eb3,
                size: 2,
                map: particleTexture,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            bgParticles = new THREE.Points(bgGeo, bgMat);
            scene.add(bgParticles);

            // 2. Create the 3D Beating Heart Shape using Math
            const heartGeo = new THREE.BufferGeometry();
            const heartCount = 3000;
            const heartPos = new Float32Array(heartCount * 3);
            const heartColors = new Float32Array(heartCount * 3);
            
            const color1 = new THREE.Color(0xff0055); // Deep Red
            const color2 = new THREE.Color(0xff758c); // Pinkish

            for (let i = 0; i < heartCount; i++) {
                // Distribute points on a sphere, then morph into heart shape
                const t = Math.random() * Math.PI * 2;
                const p = Math.acos((Math.random() * 2) - 1);
                
                // Base Heart Math
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = (Math.random() - 0.5) * 15; // Thickness

                // Scatter a bit
                x += (Math.random() - 0.5) * 2;
                y += (Math.random() - 0.5) * 2;
                z += (Math.random() - 0.5) * 2;

                // Scale up
                const scale = 2.5;
                heartPos[i*3] = x * scale;
                heartPos[i*3+1] = y * scale;
                heartPos[i*3+2] = z * scale;

                // Mix colors
                const mixRatio = Math.random();
                const mixedColor = color1.clone().lerp(color2, mixRatio);
                heartColors[i*3] = mixedColor.r;
                heartColors[i*3+1] = mixedColor.g;
                heartColors[i*3+2] = mixedColor.b;
            }

            heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
            heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

            const heartMat = new THREE.PointsMaterial({
                size: 2.5,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            heartParticles = new THREE.Points(heartGeo, heartMat);
            scene.add(heartParticles);

            // Events
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('touchmove', onPointerMove, {passive: true});
            window.addEventListener('resize', onWindowResize);
        }

        function onPointerMove(event) {
            let clientX = event.clientX;
            let clientY = event.clientY;
            
            if (event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            }

            mouseX = (clientX - windowHalfX);
            mouseY = (clientY - windowHalfY);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.02;

            // Parallax effect based on mouse/touch
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;
            
            scene.rotation.y += 0.05 * (targetX - scene.rotation.y);
            scene.rotation.x += 0.05 * (targetY - scene.rotation.x);

            // Rotate background slowly
            bgParticles.rotation.y += 0.001;
            bgParticles.rotation.x += 0.0005;

            if (heartParticles) {
                // Base rotation of heart
                heartParticles.rotation.y = time * 0.2;
                
                // Beating effect (scale pulsing using Sine wave)
                // Heart beat has a specific double-beat rhythm, approximated here:
                let beat = Math.abs(Math.sin(time * 2)) * 0.1 + Math.abs(Math.sin(time * 2 + 0.2)) * 0.05;
                let scale = 1 + beat;
                heartParticles.scale.set(scale, scale, scale);

                // Morph particles slightly to make it look "live"
                const positions = heartParticles.geometry.attributes.position.array;
                for(let i=0; i<positions.length; i+=3) {
                    // gentle sway
                    positions[i+1] += Math.sin(time + positions[i]) * 0.01; 
                }
                heartParticles.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        // --- KICKOFF ---
        window.onload = () => {
            initUI();
            init3D();
            animate();
        };

    </script>
</body>
</html>
